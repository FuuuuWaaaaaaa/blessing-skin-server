name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          extensions: mbstring, dom, fileinfo, sqlite, gd, zip, imagick
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read package version
        id: package
        run: |
          version="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build web deployment package
        run: bash tools/release.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package.outputs.version }}
          files: blessing-skin-server-${{ steps.package.outputs.version }}.zip
          generate_release_notes: false
